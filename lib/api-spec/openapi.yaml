openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: learning
    description: Authenticated learner progress
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /learning-state:
    get:
      operationId: getLearningState
      tags: [learning]
      summary: Get the current learner's saved progress
      responses:
        "200":
          description: Learning state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningState"
        "401":
          description: Authentication required
    put:
      operationId: saveLearningState
      tags: [learning]
      summary: Save the current learner's progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningStateInput"
      responses:
        "200":
          description: Saved learning state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningState"
        "400":
          description: Invalid learning state
        "401":
          description: Authentication required
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    QuizResult:
      type: object
      additionalProperties: false
      properties:
        quizId:
          type: string
        score:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 1
        completedAt:
          type: string
          format: date-time
      required: [quizId, score, total, completedAt]
    LearningState:
      type: object
      additionalProperties: false
      properties:
        completedLessonIds:
          type: array
          items: { type: string }
        inProgressLessonIds:
          type: array
          items: { type: string }
        bookmarkedLessonIds:
          type: array
          items: { type: string }
        completedProjectIds:
          type: array
          items: { type: string }
        projectTaskChecks:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        quizResults:
          type: array
          items:
            $ref: "#/components/schemas/QuizResult"
        dayGoalMinutes:
          type: integer
          minimum: 5
          maximum: 240
        activityMinutesByDate:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
      required:
        - completedLessonIds
        - inProgressLessonIds
        - bookmarkedLessonIds
        - completedProjectIds
        - projectTaskChecks
        - quizResults
        - dayGoalMinutes
        - activityMinutesByDate
    LearningStateInput:
      type: object
      additionalProperties: false
      properties:
        completedLessonIds:
          type: array
          items: { type: string }
        inProgressLessonIds:
          type: array
          items: { type: string }
        bookmarkedLessonIds:
          type: array
          items: { type: string }
        completedProjectIds:
          type: array
          items: { type: string }
        projectTaskChecks:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        quizResults:
          type: array
          items:
            $ref: "#/components/schemas/QuizResult"
        dayGoalMinutes:
          type: integer
          minimum: 5
          maximum: 240
        activityMinutesByDate:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
      required:
        - completedLessonIds
        - inProgressLessonIds
        - bookmarkedLessonIds
        - completedProjectIds
        - projectTaskChecks
        - quizResults
        - dayGoalMinutes
        - activityMinutesByDate

